<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>HAPPYREVIEW</title>
</head>
<body>
  <noscript>HAPPYREVIEW necesita JavaScript.</noscript>
  <script>
    (function () {
      var paginas = { login: 1, valoracion: 1, empresa: 1, dashboard: 1, empresas: 1, usuarios: 1 };
      var consulta = new URLSearchParams(location.search);
      var pagina = String(consulta.get('page') || '').toLowerCase();
      if (!paginas[pagina]) {
        pagina = consulta.has('e') ? 'valoracion' : 'login';
      }
      location.replace(pagina + '.html' + location.search + location.hash);
    })();
  </script>
</body>
</html>
